; Shared LoRa serial bridge — two boards, same air settings
[platformio]
default_envs = esp32-e22

[common]
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
lib_deps =
  jgromes/RadioLib @ ^6.6.0
build_flags =
  -DCORE_DEBUG_LEVEL=0

; TX / peer: ESP32-DevKitC on E22 carrier (SX1268 @ 433 MHz)
[env:esp32-e22]
extends = common
platform = espressif32
board = esp32dev
build_flags =
  ${common.build_flags}
  -DBOARD_E22

; RX / peer: Heltec Vision Master E290 (SX1262) — must be 433 MHz SKU to talk to E22
; Generic S3 board ID so older PlatformIO installs work (pins are in board_pins.h).
[env:heltec-e290]
extends = common
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  ${common.build_flags}
  -DBOARD_HELTEC_E290
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
upload_speed = 460800
